# Standard label set for TextConvo public repositories.
#
# Apply with any label sync tool, or create them by hand under
# Settings -> Labels on each repository. Keep names, colours, and meanings
# identical everywhere so filters work across the whole account.

# --- Type ------------------------------------------------------------------
- name: bug
  color: d73a4a
  description: Something does not work as documented
- name: enhancement
  color: a2eeef
  description: New example, capability, or developer-experience improvement
- name: documentation
  color: 0075ca
  description: Documentation, README, or specification wording
- name: question
  color: d876e3
  description: Usage question or request for guidance
- name: maintenance
  color: 5319e7
  description: Dependencies, tooling, CI, or repository plumbing

# --- Status ----------------------------------------------------------------
- name: triage
  color: ededed
  description: Not yet reviewed by a maintainer
- name: confirmed
  color: 0e8a16
  description: Reproduced and accepted
- name: needs info
  color: fbca04
  description: Waiting on the reporter for details or a reproduction
- name: blocked
  color: b60205
  description: Cannot proceed until something else lands
- name: wontfix
  color: ffffff
  description: Out of scope, intentional, or not worth the cost
- name: duplicate
  color: cfd3d7
  description: Already tracked elsewhere
- name: stale
  color: eeeeee
  description: No activity for an extended period

