name: Feature or example request
description: Ask for a new example, language, SDK capability, or developer-experience improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for the public developer experience: examples, SDK surface, specifications, tooling.

        Platform feature requests and roadmap questions are better raised through [textconvo.ai/contact-us](https://textconvo.ai/contact-us).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the integration you are building and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The example, method, or document you wish existed.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - API examples
        - OpenAPI specification
        - Postman collection
        - Webhooks
        - Sample apps
        - Node.js SDK
        - Python SDK
        - Go SDK
        - Java SDK
        - .NET SDK
        - PHP examples
        - Documentation links
        - Other
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language or framework
      placeholder: TypeScript / FastAPI / Laravel / Spring Boot
  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
      description: Workarounds tell us how urgent this is.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this
