name: Bug report
description: Something in a public example, specification, or SDK does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two quick reminders before you continue:

        - **Never paste real credentials or customer data.** Redact API keys, source keys, webhook secrets, phone numbers, and message bodies.
        - **Security issues do not belong here.** Follow [SECURITY.md](https://github.com/textconvo/.github/blob/main/SECURITY.md) instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I checked https://textconvo.ai/docs and the behaviour still looks wrong
          required: true
        - label: I searched existing issues, including closed ones
          required: true
        - label: This report contains no real keys, phone numbers, or customer data
          required: true
  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: Repository and file path, or the section of the specification.
      placeholder: textconvo-api-examples / examples/python/ingest_lead.py
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include the error message and, if relevant, the HTTP status code.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Request and response
      description: Paste the request and response with every secret redacted.
      render: text
  - type: input
    id: environment
    attributes:
      label: Language and runtime version
      placeholder: Python 3.12.2 / Node 20.11.1 / Go 1.22
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - Blocking my integration
        - Workaround exists but it is painful
        - Cosmetic or confusing only
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Screenshots, links, or a proposed fix are all welcome.
